name: Validate and Build Windows Installer

on:
  push:
    branches:
      - 'fix/**'
      - 'installer-build/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Build the Windows installer (slow)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: struktura-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run automated test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

  build-windows:
    name: Build and verify Windows installer
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_installer)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build branded Windows installer
        run: npm run dist:win -- --publish never

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "Struktura-CRM-Setup-*.exe" -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "No Struktura CRM installer was created in dist."
          }
          if ($installer.Length -lt 10MB) {
            throw "Installer is unexpectedly small ($($installer.Length) bytes)."
          }
          "Installer: $($installer.Name)"
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Struktura-CRM-Windows-Installer
          path: dist/Struktura-CRM-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

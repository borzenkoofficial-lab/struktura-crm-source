name: GRUZLI CRM CI

on:
  push:
    branches:
      - main
      - "redesign/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: "Tests (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Check JavaScript syntax
        run: node -e "const fs=require('node:fs');const path=require('node:path');const cp=require('node:child_process');let files=[];for(const root of ['src','tests']){if(!fs.existsSync(root))continue;const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(/\\.(?:cjs|js)$/.test(e.name))files.push(p)}};walk(root)}for(const f of files){const r=cp.spawnSync(process.execPath,['--check',f],{encoding:'utf8'});if(r.status!==0){process.stderr.write(r.stderr||r.stdout);process.exit(r.status||1)}}console.log('Syntax OK:',files.length,'files')"

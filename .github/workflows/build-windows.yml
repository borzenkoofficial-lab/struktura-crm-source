name: СКОЛ — checks and Windows release

on:
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Build the Windows installer (slow)'
        required: true
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - 'fix/**'
      - 'test/**'
  push:
    branches:
      - main
      - 'fix/**'
      - 'test/**'
      - 'installer-build/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Install dependencies and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

  build-windows:
    name: Build Windows installer
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/installer-build/') || startsWith(github.ref, 'refs/heads/fix/') || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.build_installer)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps --platform=win32 --arch=x64

      - name: Install Playwright for Electron UI checks
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/skol-playwright" --no-save --package-lock=false --ignore-scripts playwright@1.64.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run Electron responsive layout checks
        shell: pwsh
        run: npm run test:ui
        env:
          NODE_PATH: ${{ runner.temp }}\skol-playwright\node_modules
          SKOL_UI_E2E_OUTPUT: artifacts\ui-layout-smoke

      - name: Upload Electron UI screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SKOL-Electron-UI-Screenshots
          path: artifacts/ui-layout-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Build Windows installer
        run: npm run dist:win -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Windows package for packaged-app smoke
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/SKOL-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $installDir = Join-Path $env:RUNNER_TEMP "skol-installed-app"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer exited with code $($install.ExitCode)." }
          $appPath = Join-Path $installDir "СКОЛ.exe"
          if (-not (Test-Path $appPath)) {
            Get-ChildItem -Force $installDir | Format-Table -AutoSize | Out-String | Write-Host
            throw "Installed СКОЛ.exe was not found in $installDir."
          }
          "SKOL_ELECTRON_EXECUTABLE=$appPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installed app: $appPath"

      - name: Run installed Windows app smoke
        shell: pwsh
        run: npm run test:ui
        env:
          NODE_PATH: ${{ runner.temp }}\\skol-playwright\\node_modules
          SKOL_ELECTRON_EXECUTABLE: ${{ runner.temp }}\\skol-installed-app\\СКОЛ.exe
          SKOL_UI_E2E_OUTPUT: artifacts\\installed-app-smoke

      - name: Upload installed app smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SKOL-Installed-App-Smoke
          path: artifacts/installed-app-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Run installed Windows app legacy-profile upgrade smoke
        shell: pwsh
        run: npm run test:ui
        env:
          NODE_PATH: ${{ runner.temp }}\\skol-playwright\\node_modules
          SKOL_ELECTRON_EXECUTABLE: ${{ runner.temp }}\\skol-installed-app\\СКОЛ.exe
          SKOL_UI_E2E_LEGACY_PROFILE: '1'
          SKOL_UI_E2E_OUTPUT: artifacts\\installed-legacy-profile-smoke

      - name: Upload legacy-profile upgrade smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SKOL-Legacy-Profile-Upgrade-Smoke
          path: artifacts/installed-legacy-profile-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SKOL-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Build standalone License Manager
        run: npm run dist:license-manager

      - name: Upload License Manager
        uses: actions/upload-artifact@v4
        with:
          name: SKOL-License-Manager
          path: dist-license-manager/*.exe
          if-no-files-found: error
          retention-days: 14

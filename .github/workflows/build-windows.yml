name: GRUZLI CRM checks and Windows release

on:
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Build the Windows installer (slow)'
        required: true
        type: boolean
        default: false
  push:
    branches:
      - 'installer-build/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Install dependencies and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

  build-windows:
    name: Build Windows installer
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/installer-build/') || (github.event_name == 'workflow_dispatch' && inputs.build_installer)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GRUZLI-CRM-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

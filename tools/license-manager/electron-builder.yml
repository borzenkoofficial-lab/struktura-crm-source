appId: ru.skol.license-manager
productName: SKOL License Manager
asar: true
directories:
  output: dist-license-manager
files:
  - tools/license-manager/**/*
  - tools/license-generator.cjs
  - src/license-core.cjs
  - src/license-catalog.cjs
  - src/license-config.cjs
  - src/license-config-storage.cjs
  - src/license-public-key.pem
  - package.json
extraMetadata:
  main: tools/license-manager/main.cjs
win:
  icon: build/skol.ico
  target:
    - target: portable
      arch:
        - x64
  artifactName: SKOL-License-Manager-${version}.${ext}
